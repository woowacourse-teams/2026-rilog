name: rilog-image

services:
  image-api:
    image: koreaioi/rilog-image-server:latest
    init: true
    restart: unless-stopped
    env_file:
      - image.env
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    memswap_limit: 768m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
