spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

logging:
  structured:
    format:
      console: logstash
    json:
      stacktrace:
        printer: kr.rilog.global.logging.SanitizingStackTracePrinter
  level:
    kr.rilog: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
