spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: rilog-backend
        environment: dev
      stacktrace:
        printer: kr.rilog.global.logging.SanitizingStackTracePrinter
  level:
    kr.rilog: debug
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
