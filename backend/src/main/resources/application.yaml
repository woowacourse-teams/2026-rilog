spring:
  application:
    name: backend
  jpa:
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  forward-headers-strategy: framework

post:
  trending:
    enabled: ${POST_TRENDING_ENABLED:true}
    cron: ${POST_TRENDING_CRON:0 0 5,11,17,23 * * *}
    half-life-days: ${POST_TRENDING_HALF_LIFE_DAYS:7}
  view:
    flush:
      enabled: ${POST_VIEW_FLUSH_ENABLED:true}
      interval: ${POST_VIEW_FLUSH_INTERVAL:10m}
    registration:
      enabled: ${POST_VIEW_REGISTRATION_ENABLED:false}
      cookie-secure: ${POST_VIEW_COOKIE_SECURE:true}
      cookie-same-site: ${POST_VIEW_COOKIE_SAME_SITE:Lax}

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    callback-uri: ${GITHUB_CALLBACK_URI:http://localhost:5173/auth/github/callback}
    state-ttl: 5m
    scope: read:user,user:email
    token-uri: https://github.com/login/oauth/access_token
    user-uri: https://api.github.com/user
    connect-timeout: 3s
    read-timeout: 3s

auth:
  access-token:
    secret: ${ACCESS_TOKEN_SECRET:local-development-access-token-secret-change-me}
    expiration: ${ACCESS_TOKEN_EXPIRATION:15m}
  onboarding-token:
    secret: ${ONBOARDING_TOKEN_SECRET:local-development-onboarding-token-secret-change-me}
    expiration: ${ONBOARDING_TOKEN_EXPIRATION:24h}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:14d}
    cookie-name: refresh_token
    cookie-path: ${REFRESH_TOKEN_PATH}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_SAME_SITE_OPTION:Lax}

internal-api:
  lambda:
    # 이미지 압축 Lambda와 공유하는 HMAC 비밀키. 기본값을 두지 않아 누락 시 기동에 실패한다.
    secret: ${INTERNAL_LAMBDA_SECRET}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    root-directory: ${AWS_S3_DIRECTORY}
    presigned-url-expiration-minutes: 10


site:
  sitemap:
    base-url: ${SITE_BASE_URL:https://www.rilog.kr}
    cache-max-age: ${SITEMAP_CACHE_MAX_AGE:10m}

the-rilog:
  enabled: ${THE_RILOG_ENABLED:false}
  spreadsheet-id: ${THE_RILOG_SPREADSHEET_ID:}
  sheet-range: ${THE_RILOG_SHEET_RANGE:SPOTLIGHTS!A:M}
  news-sheet-range: ${THE_RILOG_NEWS_SHEET_RANGE:NEWS!A:G}
  publication-cron: ${THE_RILOG_PUBLICATION_CRON:0 0 5 * * *}
  publication-fallback-cron: ${THE_RILOG_PUBLICATION_FALLBACK_CRON:0 30 5 * * *}
  credentials-path: ${THE_RILOG_CREDENTIALS_PATH:}
  connect-timeout: 3s
  read-timeout: 5s
