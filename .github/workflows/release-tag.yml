name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [production]

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release helpers
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Calculate next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # 1. 태그 목록 조회 (API 1회 호출로 재사용)
          tags_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags")"

          # 1-1. 멱등성 보장: 동일 머지 커밋에 이미 태그가 존재하는지 확인 (Re-run 대응)
          existing_tag="$(echo "$tags_json" \
            | jq -r --arg sha "$MERGE_SHA" '.[] | select(.commit.sha == $sha) | .name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [ -n "$existing_tag" ]; then
            echo "이미 $MERGE_SHA 커밋에 $existing_tag 태그가 존재합니다. 태그를 재사용합니다."
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1-2. 기준이 될 최신 정식 semver 태그 조회
          latest="$(echo "$tags_json" | jq -r '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          # 2. PR에 포함된 모든 커밋 메시지 수집 (제목과 전체 본문 분리)
          commits_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits")"
          commit_headers="$(echo "$commits_json" | jq -r '.[].commit.message | split("\n")[0] | sub("\r$"; "")')"
          commit_messages="$(echo "$commits_json" | jq -r '.[].commit.message')"

          titles=$(printf "%s\n%s" "$PR_TITLE" "$commit_headers")
          all_text=$(printf "%s\n%s" "$PR_TITLE" "$commit_messages")

          # 3. Major (Breaking Change) 감지:
          # - 제목: [Feature!], [Fix!]!, feat!:, fix(api)!: 등 (선행 공백 허용)
          # - 본문/제목: BREAKING CHANGE:, BREAKING-CHANGE: (글머리 기호/선행 공백 허용)
          is_major=false
          if echo "$titles" | grep -qiE '^[[:space:]]*(\[[A-Za-z]+!\]|\[[A-Za-z]+\]!|[A-Za-z]+(\([^)]*\))?[[:space:]]*![[:space:]]*:)'; then
            is_major=true
          elif echo "$all_text" | grep -qiE '^[[:space:]]*[-*]?[[:space:]]*BREAKING[ -]CHANGE:'; then
            is_major=true
          fi

          # 4. Minor (Feature) 감지:
          # - 제목에서만 감지 (선행 공백 허용, 본문의 squash 서브 커밋 목록/설명으로 인한 오판 방지)
          # - 대괄호 형태: [Feature], [Feat]
          # - 콜론 형태: feature:, feat:, feature(auth):, feat(ui): 등
          is_minor=false
          if echo "$titles" | grep -qiE '^[[:space:]]*(\[(feat|feature)\]|(feat|feature)(\([^)]*\))?[[:space:]]*:)'; then
            is_minor=true
          fi

          # 5. 다음 버전 산출
          if [ -z "$latest" ]; then
            tag="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [ "$is_major" = true ]; then
              tag="v$((major + 1)).0.0"
            elif [ "$is_minor" = true ]; then
              tag="v${major}.$((minor + 1)).0"
            else
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "Bump 결정: major=$is_major, minor=$is_minor (최신: ${latest:-없음} → $tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          TARGET_COMMITISH: ${{ github.event.pull_request.merge_commit_sha }}
        run: node scripts/update-release-notes.cjs

      - name: Record run
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Release"
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
