name: rilog-be-dev.yml

on:
  push:
    branches: [ "develop" ]
    paths:
      - "backend/**"
      - '.github/workflows/rilog-be-dev.yml'

  pull_request:
    branches: [ "develop" ]
    paths:
      - "backend/**"
      - '.github/workflows/rilog-be-dev.yml'

jobs:
  build:
    name: Build Rilog Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 캐시 설정
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradle Build를 위한 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Rilog Service
        run: ./gradlew clean build -x test

      # Docker Setup & 로그인 (v3로 업데이트 및 공식 Action 활용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build & push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile-dev \
            -t ${{ secrets.DOCKER_USER_NAME }}/${{ secrets.DOCKER_IMAGE }}:${{ secrets.DOCKER_TAG }} \
            --push .

  deploy:
    name: Deploy Rilog Dev
    runs-on: self-hosted
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Deploy to server
        run: |
          cd /home/ubuntu
          ./deploy.sh
