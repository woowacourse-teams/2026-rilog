name: Rilog FE Quality Gates

# Frontend Quality is required on both target branches. Keep a check on every PR;
# unrelated changes skip the expensive steps inside the job.
on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.rilog.test
      NEXT_PUBLIC_DEV_MASTER_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend changes
        id: changes
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD -- frontend/ .github/workflows/rilog-fe-quality-gates.yml > "$RUNNER_TEMP/frontend-changed-paths"
          if [[ -s "$RUNNER_TEMP/frontend-changed-paths" ]]; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            echo 'Frontend 또는 품질 workflow 변경이 있어 전체 검증을 실행합니다.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
            echo 'Frontend와 품질 workflow 변경이 없어 전체 검증을 건너뜁니다.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          QUALITY_LOG_DIR="${RUNNER_TEMP}/rilog-quality-logs"
          mkdir -p "$QUALITY_LOG_DIR"
          set -o pipefail
          pnpm check 2>&1 | tee "$QUALITY_LOG_DIR/check.log"

      - name: Install Playwright Chromium headless shell
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run production E2E
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          QUALITY_LOG_DIR="${RUNNER_TEMP}/rilog-quality-logs"
          mkdir -p "$QUALITY_LOG_DIR"
          set -o pipefail
          pnpm test:e2e:prod 2>&1 | tee "$QUALITY_LOG_DIR/e2e.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rilog-quality-logs
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
