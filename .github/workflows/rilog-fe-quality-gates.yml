name: Rilog FE Quality Gates

on:
  pull_request:
    branches: [develop, production]
    paths:
      - "frontend/**"
      - ".github/workflows/rilog-fe-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_DEV_MASTER_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        shell: bash
        run: |
          QUALITY_LOG_DIR="${RUNNER_TEMP}/rilog-quality-logs"
          mkdir -p "$QUALITY_LOG_DIR"
          set -o pipefail
          pnpm check 2>&1 | tee "$QUALITY_LOG_DIR/check.log"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production E2E
        shell: bash
        run: |
          QUALITY_LOG_DIR="${RUNNER_TEMP}/rilog-quality-logs"
          mkdir -p "$QUALITY_LOG_DIR"
          set -o pipefail
          pnpm test:e2e:prod 2>&1 | tee "$QUALITY_LOG_DIR/e2e.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rilog-quality-logs
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
