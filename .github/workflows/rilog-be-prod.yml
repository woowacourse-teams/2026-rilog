name: rilog-be-prod.yml

on:
  push:
    branches: [ "production" ]
    paths:
      - "backend/**"
      - ".github/workflows/rilog-be-prod.yml"

  pull_request:
    branches: [ "production" ]
    paths:
      - "backend/**"
      - ".github/workflows/rilog-be-prod.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rilog Prod
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('backend/**/*gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Rilog Service
        run: ./gradlew build --build-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build & push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USER_NAME }}/${{ secrets.DOCKER_IMAGE }}:prod
            ${{ secrets.DOCKER_USER_NAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy:
    name: Deploy Rilog Prod
    runs-on: [ self-hosted, rilog-be-prod ]
    needs: build
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy to server
        run: |
          cd /home/ubuntu
          ./deploy.sh
