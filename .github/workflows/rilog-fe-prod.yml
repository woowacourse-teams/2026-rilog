name: rilog-fe-prod.yml

on:
  # 수동으로 워크플로우를 실행하여 인프라 세팅을 테스트할 수 있도록 추가
  workflow_dispatch:
  # production 브랜치에 코드가 병합(Push)될 때 배포 실행
  push:
    branches: ["production"]
    paths:
      - "frontend/**"
      - ".github/workflows/rilog-fe-prod.yml"

  # PR 생성/업데이트 시에는 빌드(build) Job까지만 실행하여 사전 검증
  pull_request:
    branches: ["production"]
    paths:
      - "frontend/**"
      - ".github/workflows/rilog-fe-prod.yml"

concurrency:
  # Never interrupt an in-progress production deploy when a newer push arrives.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Build Rilog FE PROD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file for Build
        env:
          ENV_SECRET: ${{ secrets.ENV_PROD_FE }}
        run: |
          echo "$ENV_SECRET" > .env

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.event_name == 'push' && 'prod' || 'preview' }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_UPLOAD_REQUIRED: ${{ github.event_name == 'push' && 'true' || 'false' }}
        shell: bash
        run: |
          if [[ "$SENTRY_UPLOAD_REQUIRED" == 'true' ]]; then
            node --env-file=.env scripts/verify-sentry-production.mjs
            node --env-file=.env -e "if (!process.env.SENTRY_AUTH_TOKEN) { console.error('Production Sentry source map upload requires SENTRY_AUTH_TOKEN.'); process.exit(1); }"
            node --env-file=.env -e "if (!process.env.THE_RILOG_REVALIDATION_SECRET?.trim()) { console.error('Daily ISR requires THE_RILOG_REVALIDATION_SECRET.'); process.exit(1); }"
          fi
          if [[ '${{ github.event_name }}' != 'push' ]]; then
            export NEXT_PUBLIC_SENTRY_ENABLED=false
          fi
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            node scripts/create-the-rilog-fixture.mjs
            THE_RILOG_SNAPSHOT_PATH=.the-rilog-build/fixture.json THE_RILOG_ALLOW_FIXTURE=true pnpm prepare:the-rilog
          else
            pnpm prepare:the-rilog
          fi
          pnpm build
          node scripts/verify-the-rilog-build.mjs

      - name: Verify public source maps are absent
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ -n "$(find .next/static -type f -name '*.map' -print -quit)" ]]; then
            echo 'Public source maps remain in the production artifact.' >&2
            exit 1
          fi

      - name: Package artifacts
        # node_modules를 제외하고 빌드 산출물과 필수 설정 파일만 압축 (OOM 방지 및 빠른 업로드)
        run: |
          tar --exclude=.next/cache --exclude=.next/dev -czf fe-build.tar.gz .next public package.json pnpm-lock.yaml pnpm-workspace.yaml ecosystem.config.cjs next.config.ts test-harness/sentry-smoke-config.mjs .the-rilog-build/snapshot.json scripts/refresh-the-rilog.mjs scripts/install-the-rilog-timer.sh deploy

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fe-build-artifact
          path: frontend/fe-build.tar.gz
          retention-days: 1

  deploy:
    name: Deploy Rilog FE PROD
    runs-on: [self-hosted, frontend] # frontend 라벨로 분기
    needs: build
    if: github.event_name == 'push'
    concurrency:
      group: rilog-fe-production
      cancel-in-progress: false
      queue: max

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fe-build-artifact
          path: /tmp/rilog-fe

      - name: Setup Node PATH
        run: |
          NODE_BIN=$(find $HOME/.nvm/versions/node -maxdepth 1 -type d | sort -V | tail -1)/bin
          echo "$NODE_BIN" >> $GITHUB_PATH

      - name: Deploy to Server
        env:
          ENV_SECRET: ${{ secrets.ENV_PROD_FE }}
        run: |
          TARGET_DIR="/home/ubuntu/rilog-next"

          # Check timer installation privileges before changing the running deployment.
          sudo -n true
          if sudo -n systemctl cat the-rilog-refresh.timer >/dev/null 2>&1; then
            # Restore scheduling even if a later deployment command fails.
            if sudo -n systemctl is-active --quiet the-rilog-refresh.timer; then
              trap 'sudo -n systemctl start the-rilog-refresh.timer' EXIT
            fi
            sudo -n systemctl stop the-rilog-refresh.timer
            # Let an existing refresh finish before replacing its snapshot and page files.
            for attempt in {1..190}; do
              REFRESH_STATE=$(sudo -n systemctl show --property=ActiveState --value the-rilog-refresh.service)
              if [[ "$REFRESH_STATE" == 'inactive' || "$REFRESH_STATE" == 'failed' ]]; then
                break
              fi
              if [[ "$attempt" == 190 ]]; then
                echo 'The Rilog refresh did not finish before the deployment wait limit.' >&2
                exit 1
              fi
              sleep 2
            done
          fi

          # 0. 이전 빌드 산출물 정리 (node_modules는 재사용해서 install 속도 확보)
          mkdir -p $TARGET_DIR
          rm -rf $TARGET_DIR/.next $TARGET_DIR/public

          # 1. 대상 디렉터리 생성 및 압축 해제
          mkdir -p $TARGET_DIR
          tar -xzf /tmp/rilog-fe/fe-build.tar.gz -C $TARGET_DIR
          rm -rf /tmp/rilog-fe

          cd $TARGET_DIR

          # 런타임 전용 secret. 빌드 artifact에는 포함하지 않는다.
          umask 077
          printf '%s\n' "$ENV_SECRET" > .env.production.local

          # 2. EC2 서버에서 의존성 설치 (실행 환경 호환성 문제 우회)
          npm install -g pnpm@11.21.0
          pnpm install --prod --frozen-lockfile

          # 3. pm2 재시작
          # ecosystem.config.cjs를 사용해 프로세스 리로드 (update-env로 환경변수 갱신 보장)
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save

          # The daily job captures data and warms only /the-rilog; it never builds or reloads PM2.
          bash scripts/install-the-rilog-timer.sh
