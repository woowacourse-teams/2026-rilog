name: rilog-fe-dev.yml

on:
  # 수동으로 워크플로우를 실행하여 인프라 세팅을 테스트할 수 있도록 추가
  workflow_dispatch:
  # develop 브랜치에 코드가 병합(Push)될 때 배포 실행
  push:
    branches: [ "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/rilog-fe-dev.yml"
  
  # PR 생성/업데이트 시에는 빌드(build) Job까지만 실행하여 사전 검증
  pull_request:
    branches: [ "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/rilog-fe-dev.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rilog FE Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # package.json engines 기준

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file for Build
        env:
          ENV_SECRET: ${{ secrets.ENV_DEV }}
        run: |
          echo "$ENV_SECRET" > .env

      - name: Build Next.js app
        run: pnpm build

      - name: Package artifacts
        # node_modules를 제외하고 빌드 산출물과 필수 설정 파일만 압축 (OOM 방지 및 빠른 업로드)
        run: |
          tar -czf fe-build.tar.gz .next public package.json pnpm-lock.yaml ecosystem.config.cjs next.config.ts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fe-build-artifact
          path: frontend/fe-build.tar.gz
          retention-days: 1

  deploy:
    name: Deploy Rilog FE Dev
    runs-on: [ self-hosted, frontend ] # frontend 라벨로 분기
    needs: build
    # 테스트를 위해 임시로 PR(pull_request) 업데이트 시에도 배포되도록 허용
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fe-build-artifact
          path: /tmp/rilog-fe

      - name: Deploy to Server
        run: |
          # 1. NVM_DIR 환경변수 동적 할당
          export NVM_DIR="$HOME/.nvm"
          
          # 2. nvm.sh가 진짜 있는지 검사하고, 없으면 명확한 에러를 뿜게 만듦
          if [ ! -f "$NVM_DIR/nvm.sh" ]; then
            echo "❌ 에러: nvm.sh 파일을 찾을 수 없습니다! (경로: $NVM_DIR/nvm.sh)"
            echo "만약 EC2에서 sudo를 붙여서 nvm을 설치하셨다면 경로가 다를 수 있습니다."
            exit 1
          fi
          
          # 3. nvm.sh 강제 실행 (nvm 함수 등록)
          source "$NVM_DIR/nvm.sh"
          
          # 4. 이제 nvm 명령어가 정상 작동합니다!
          nvm install 24
          nvm use 24
          
          # 확인용 로그
          echo "✅ Node version: $(node -v)"
          echo "✅ NPM version: $(npm -v)"
          
          TARGET_DIR="$HOME/rilog-next"
          
          # 5. 대상 디렉터리 생성 및 압축 해제
          mkdir -p $TARGET_DIR
          tar -xzf /tmp/rilog-fe/fe-build.tar.gz -C $TARGET_DIR
          rm -rf /tmp/rilog-fe
          
          cd $TARGET_DIR
          
          # 6. 활성화된 Node 24 버전에 전역 패키지 설치
          npm install -g pnpm@11.21.0 pm2
          
          # 7. 의존성 설치 및 PM2 실행
          pnpm install --prod --frozen-lockfile
          
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
